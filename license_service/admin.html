<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载器授权管理</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e5e7eb;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1220px;margin:auto;padding:28px 20px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}h1{margin:0;font-size:28px}h2{margin:0 0 8px;font-size:18px}.muted{color:#94a3b8}.panel{background:#111b2e;border:1px solid #263652;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #0002}.row,.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.toolbar{margin-bottom:12px}.grow{flex:1;min-width:220px}input,button,select{border:1px solid #3b4d6b;border-radius:8px;padding:9px 11px;background:#0f172a;color:#e5e7eb;font:inherit}button{cursor:pointer;background:#2563eb;border-color:#2563eb}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#25324a;border-color:#3b4d6b}button.danger{background:#b42318;border-color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:11px 10px;border-bottom:1px solid #263652;text-align:left;vertical-align:middle}th{color:#93c5fd;font-weight:600}.order{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.badge{display:inline-block;padding:3px 8px;border-radius:20px;white-space:nowrap;background:#14532d;color:#bbf7d0}.badge.off{background:#4c1d1d;color:#fecaca}.product-dingtalk{background:#173d67;color:#bfdbfe}.product-qlchat{background:#253d37;color:#99f6d3}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:12px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.hidden{display:none}pre{white-space:pre-wrap;background:#0b1220;border-radius:8px;padding:10px;color:#a7f3d0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:16px}.product-card{padding:14px;background:#111b2e;border:1px solid #263652;border-radius:10px}.product-card strong{display:block;margin-bottom:4px}a{color:#93c5fd}#notice{min-height:24px;color:#a7f3d0;margin:8px 0 0}.note{font-size:13px;margin:8px 0 12px}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div><h1>下载器授权管理</h1><div class="muted">订单号就是兑换码 · 每个软件的订单和设备独立管理</div></div><div class="muted" id="summary">未登录</div></section>
<section class="products" aria-label="软件与商品对应关系">
<div class="product-card"><strong>钉钉下载器</strong><div class="muted">商品：1077040786555、1072903550181<br>兼容旧版钉钉客户端，已有授权继续有效。</div></div>
<div class="product-card"><strong>千聊下载器</strong><div class="muted">商品：<a href="https://www.goofish.com/item?id=1093753190581" target="_blank" rel="noreferrer">1093753190581</a><br>千聊课程下载器，把好课程留在身边。</div></div>
</section>
<section class="panel"><div class="row"><input class="grow" id="token" type="password" autocomplete="off" aria-label="管理员令牌" placeholder="管理员令牌"><button id="login">鉴权并加载</button></div><div class="muted note">令牌只保存在当前页面内存，不写入浏览器存储。</div><div class="row"><label for="sync-product">同步软件</label><select id="sync-product"><option value="dingtalk">钉钉下载器</option><option value="qlchat">千聊下载器</option></select><button class="secondary" id="sync">同步钉钉订单</button><span class="muted">仅同步所选软件对应商品的有效付款订单。</span></div><p id="notice" role="status"></p></section>
<section class="panel"><h2>新增订单授权</h2><p class="muted note">先选择所属软件，再填原始闲鱼订单号。订单号同时作为兑换码，无需额外生成；已有授权的软件类型不能修改。</p><div class="row"><select id="create-product" aria-label="新授权所属软件"><option value="">请选择软件</option><option value="dingtalk">钉钉下载器</option><option value="qlchat">千聊下载器</option></select><input class="grow" id="order" placeholder="闲鱼订单号（同时作为兑换码）" autocomplete="off"><input id="expiry" aria-label="授权到期时间" type="datetime-local"><button id="create">创建授权</button></div><pre id="newcode" class="hidden"></pre></section>
<section class="panel"><div class="toolbar"><label for="product-filter">所属软件</label><select id="product-filter"><option value="">全部软件</option><option value="dingtalk">钉钉下载器</option><option value="qlchat">千聊下载器</option></select><input class="grow" id="search" placeholder="搜索完整订单号"><button class="secondary" id="searchBtn">搜索</button><button class="secondary" id="clearBtn">清除</button><label class="muted">每页 15 条</label></div><div class="table-wrap"><table><thead><tr><th>所属软件</th><th>订单号 / 兑换码</th><th>设备</th><th>状态</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span class="muted" id="pageInfo"></span><div><button class="secondary" id="prev">上一页</button><button class="secondary" id="next">下一页</button></div></div></section>
</main>
<script>
'use strict';
let auth='',page=1,pages=1;const records=new Map();
const $=id=>document.getElementById(id),names={dingtalk:'钉钉下载器',qlchat:'千聊下载器'};
const headers=()=>({'Authorization':'Bearer '+auth,'Content-Type':'application/json'});
const esc=s=>{const e=document.createElement('span');e.textContent=s??'';return e.innerHTML;};
function notice(message){$('notice').textContent=message;}
async function request(url,method='GET',body){if(!auth)throw Error('请先鉴权');const r=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求失败');return d;}
async function load(){try{const q=new URLSearchParams({q:$('search').value.trim(),page:String(page),page_size:'15'});if($('product-filter').value)q.set('product',$('product-filter').value);const d=await request('/admin/licenses?'+q);pages=d.pages;records.clear();for(const row of d.items)records.set(row.id,row);$('summary').textContent=`${$('product-filter').value?names[$('product-filter').value]:'全部软件'} · ${d.total} 条授权`;$('pageInfo').textContent=`第 ${d.page}/${d.pages} 页`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('rows').innerHTML=d.items.map(x=>`<tr><td><span class="badge product-${x.product==='qlchat'?'qlchat':'dingtalk'}">${esc(x.product_name||names[x.product]||'未知软件')}</span></td><td class="order">${esc(x.order_id)}</td><td>${x.device_count}/2</td><td><span class="badge ${x.revoked?'off':''}">${x.revoked?'已撤销':'有效'}</span></td><td>${x.expires_at?new Date(x.expires_at*1000).toLocaleString():'长期'}</td><td class="actions"><button data-action="toggle" data-id="${esc(x.id)}">${x.revoked?'恢复':'撤销'}</button><button class="secondary" data-action="reset" data-id="${esc(x.id)}">重置设备</button><button class="danger" data-action="delete" data-id="${esc(x.id)}">删除</button></td></tr>`).join('');}catch(e){notice(e.message);}}
$('login').onclick=()=>{auth=$('token').value.trim();$('token').value='';page=1;load();};
$('searchBtn').onclick=()=>{page=1;load();};$('clearBtn').onclick=()=>{$('search').value='';page=1;load();};$('product-filter').onchange=()=>{page=1;load();};$('search').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click();};$('prev').onclick=()=>{if(page>1){page--;load();}};$('next').onclick=()=>{if(page<pages){page++;load();}};
$('sync-product').onchange=()=>{$('sync').textContent='同步'+($('sync-product').value==='qlchat'?'千聊':'钉钉')+'订单';};
$('sync').onclick=async()=>{const product=$('sync-product').value;try{$('sync').disabled=true;const d=await request('/admin/sync-orders?product='+encodeURIComponent(product),'POST');notice(`${names[product]}同步完成：来源 ${d.source_count}，新增 ${d.created}，修复 ${d.repaired||0}，已存在 ${d.skipped||0}。`);$('product-filter').value=product;page=1;await load();}catch(e){notice(e.message);}finally{$('sync').disabled=false;}};
$('create').onclick=async()=>{const product=$('create-product').value;if(!product){notice('请先选择新授权所属软件。');return;}try{const raw=$('expiry').value;const order=$('order').value.trim();const d=await request('/admin/licenses','POST',{product,order_id:order,code:order,expires_at:raw?Math.floor(new Date(raw).getTime()/1000):null});$('newcode').classList.remove('hidden');$('newcode').textContent=names[product]+'\n订单号 / 兑换码：'+d.code;$('order').value='';$('product-filter').value=product;page=1;await load();}catch(e){notice(e.message);}};
$('rows').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const row=records.get(b.dataset.id);if(!row)return;const label=`【${row.product_name||names[row.product]}】订单 ${row.order_id}`;try{if(b.dataset.action==='toggle'&&confirm((row.revoked?'恢复':'撤销')+label+' 的授权？'))await request('/admin/licenses/'+row.id,'PATCH',{revoked:!row.revoked});if(b.dataset.action==='reset'&&confirm('重置 '+label+' 的设备绑定？'))await request('/admin/licenses/'+row.id+'/reset-devices','POST');if(b.dataset.action==='delete'&&confirm('永久删除 '+label+' 的授权及设备绑定？'))await request('/admin/licenses/'+row.id,'DELETE');await load();}catch(err){notice(err.message);}};
</script>
</body></html>
